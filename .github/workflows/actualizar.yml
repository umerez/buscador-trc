name: Actualizar índice de resoluciones

# La pasada nocturna corre en el Mac de Umerez (launchd, ops/actualizar_nocturno.sh) porque desde las IP de
# GitHub Actions el portal de Navarra no responde y el de Madrid corta el listado con 404 (comprobado el
# 11/10/2026). Este workflow queda para lanzarlo a mano desde la pestaña Actions.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "actual (año en curso) o completo (backfill de todos los años)"
        default: "actual"
        type: choice
        options: [actual, completo]
      tribunal:
        description: "id de un tribunal (vacío = todos)"
        default: ""

permissions:
  contents: write

concurrency:
  group: indice
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Construir índice
        run: |
          MODO="${{ github.event.inputs.modo || 'actual' }}"
          TRIB="${{ github.event.inputs.tribunal }}"
          ARGS="--$MODO"
          if [ -n "$TRIB" ]; then ARGS="$ARGS --tribunal $TRIB"; fi
          python construir_indice.py $ARGS
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios en el índice"
          else
            git commit -m "Índice actualizado $(date -u +%Y-%m-%d)"
            git push
          fi
